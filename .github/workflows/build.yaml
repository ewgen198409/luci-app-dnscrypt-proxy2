name: Build Package

on:
  workflow_dispatch:

jobs:
  build:
    name: Build for aarch64_generic ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.10"
            sdk: aarch64_generic-24.10.0
          - version: "25.12"
            sdk: aarch64_generic-25.12-SNAPSHOT
    steps:
      - uses: actions/checkout@v4

      - name: Copy package to SDK
        run: |
          mkdir -p package/luci-app-dnscrypt-proxy2
          cp Makefile package/luci-app-dnscrypt-proxy2/
          cp -r htdocs root package/luci-app-dnscrypt-proxy2/

      - name: Build
        uses: openwrt/gh-action-sdk@v10
        env:
          ARCH: ${{ matrix.sdk }}
          FEED_DIR: ${{ github.workspace }}/package
          PACKAGES: luci-app-dnscrypt-proxy2
          V: s

      - name: List built packages
        run: |
          find . -type f \( -name "*.ipk" -o -name "*.apk" \) 2>/dev/null | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-dnscrypt-proxy2-${{ matrix.version }}
          path: |
            **/*.ipk
            **/*.apk
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(awk -F':=' '$1 == "PKG_VERSION" { gsub(/[[:space:]]/, "", $2); print $2; exit }' Makefile)"
          release="$(awk -F':=' '$1 == "PKG_RELEASE" { gsub(/[[:space:]]/, "", $2); print $2; exit }' Makefile)"
          test -n "$version" && test -n "$release"
          tag_name="v${version}-${release}"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          if gh release view "$tag_name" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: luci-app-dnscrypt-proxy2-*
          path: release
          merge-multiple: true

      - name: Verify downloaded packages
        if: steps.release.outputs.publish == 'true'
        run: |
          find release -type f -print
          count="$(find release -type f \( -name "*.ipk" -o -name "*.apk" \) | wc -l)"
          test "$count" -gt 0 || { echo "::error::No IPK or APK packages were downloaded"; exit 1; }

      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: luci-app-dnscrypt-proxy2 ${{ steps.release.outputs.tag_name }}
          generate_release_notes: true
          files: release/**/*
          fail_on_unmatched_files: true
